name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run setup
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: bash -n deploy/release.sh
      - run: docker build -t unstressed-check .
